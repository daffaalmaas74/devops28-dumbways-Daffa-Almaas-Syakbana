- name: Install Prometheus with Docker Compose
  hosts: monitoring
  become: true

  tasks:
    - name: Buat directory Prometheus
      ansible.builtin.file:
        path: "/home/{{ new_user }}/prometheus"
        state: directory
        owner: "{{ new_user }}"
        group: "{{ new_user }}"
        mode: "0755"

    - name: Buat prometheus.yml
      ansible.builtin.copy:
        dest: "/home/{{ new_user }}/prometheus/prometheus.yml"
        owner: "{{ new_user }}"
        group: "{{ new_user }}"
        mode: "0644"
        content: |
          global:
            scrape_interval: 15s

          scrape_configs:
            - job_name: "node-exporter"
              static_configs:
                - targets:
                    - "52.231.66.19:9100"
                  labels:
                    server: "additional-depedencies"

                - targets:
                    - "40.125.82.199:9100"
                  labels:
                    server: "appserver"

                - targets:
                    - "104.208.95.228:9100"
                  labels:
                    server: "database"

                - targets:
                    - "20.9.195.168:9100"
                  labels:
                    server: "gateway"

                - targets:
                    - "20.194.21.16:9100"
                  labels:
                    server: "jenkins"

                - targets:
                    - "20.213.139.187:9100"
                  labels:
                    server: "master"

                - targets:
                    - "104.208.110.29:9100"
                  labels:
                    server: "monitoring"

                - targets:
                    - "20.58.188.114:9100"
                  labels:
                    server: "worker-1"

                - targets:
                    - "20.222.36.162:9100"
                  labels:
                    server: "worker-2"

            - job_name: "cadvisor"
              static_configs:
                - targets:
                    - "52.231.66.19:8081"
                  labels:
                    server: "additional-depedencies"

                - targets:
                    - "40.125.82.199:8081"
                  labels:
                    server: "appserver"

                - targets:
                    - "104.208.95.228:8081"
                  labels:
                    server: "database"

                - targets:
                    - "20.9.195.168:8081"
                  labels:
                    server: "gateway"

                - targets:
                    - "20.194.21.16:8081"
                  labels:
                    server: "jenkins"

                - targets:
                    - "20.213.139.187:8081"
                  labels:
                    server: "master"

                - targets:
                    - "104.208.110.29:8081"
                  labels:
                    server: "monitoring"

                - targets:
                    - "20.58.188.114:8081"
                  labels:
                    server: "worker-1"

                - targets:
                    - "20.222.36.162:8081"
                  labels:
                    server: "worker-2"

    - name: Generate bcrypt password
      ansible.builtin.command:
        cmd: >
          docker run --rm httpd:latest
          htpasswd -nbB "{{ username_prometheus }}" "{{ password_prometheus }}"
      register: prometheus_htpasswd
      changed_when: false
      no_log: true

    - name: Buat web.yml Prometheus
      ansible.builtin.copy:
        dest: "/home/{{ new_user }}/prometheus/web.yml"
        owner: "{{ new_user }}"
        group: "{{ new_user }}"
        mode: "0644"
        content: |
          basic_auth_users:
            {{ username_prometheus }}: "{{ prometheus_htpasswd.stdout.split(':', 1)[1] }}"
      no_log: true

    - name: Buat docker-compose.yml
      ansible.builtin.copy:
        dest: "/home/{{ new_user }}/prometheus/docker-compose.yml"
        owner: "{{ new_user }}"
        group: "{{ new_user }}"
        mode: "0644"
        content: |
          services:
            prometheus:
              image: prom/prometheus:latest
              container_name: prometheus
              restart: unless-stopped
              ports:
                - "9090:9090"
              volumes:
                - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
                - ./web.yml:/etc/prometheus/web.yml:ro
              command:
                - "--config.file=/etc/prometheus/prometheus.yml"
                - "--web.config.file=/etc/prometheus/web.yml"

    - name: Jalankan Prometheus
      community.docker.docker_compose_v2:
        project_src: "/home/{{ new_user }}/prometheus"
        state: present