- name: Install Docker
  hosts: all
  become: true

  tasks:

    - name: Update repository
      ansible.builtin.apt:
        update_cache: true

    - name: Upgrade package
      ansible.builtin.apt:
        upgrade: dist

    - name: Install dependency Docker
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: true

    - name: Buat direktori Docker keyrings
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Download Docker GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        owner: root
        group: root
        mode: "0644"

    - name: Tambahkan Docker repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/ubuntu
          {{ ansible_facts['distribution_release'] }} stable
        filename: docker
        state: present
        update_cache: true

    - name: Install Docker
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Aktifkan dan jalankan Docker
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    - name: Tambahkan user ke group Docker
      ansible.builtin.user:
        name: "{{ new_user }}"
        groups: docker
        append: true